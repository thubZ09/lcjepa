[project]
name = "lcjepa"
version = "0.1.0"
description = "LC-JEPA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["jepa", "self-supervised", "light-curves", "agn", "quasars", "anomaly-detection"]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "einops>=0.8",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
data = [
    "astropy>=6.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "ztfquery>=1.26",
]
viz = [
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
lcjepa-pretrain = "core.pretrain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "NPY"]
ignore = ["E501"]  

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
